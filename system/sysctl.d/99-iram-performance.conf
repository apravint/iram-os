# ==============================================================================
# IRAM OS High-Performance Kernel & Network Tuning
# Adopted from Upstream Omarchy 4.5 & Linux Kernel Best Practices
# ==============================================================================

# Enable Google BBR TCP Congestion Control with Fair Queuing (FQ)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Interactive Desktop Memory & Swap Tuning
vm.swappiness = 10
vm.vfs_cache_pressure = 50

# Inotify watches for fast file events (Neovim, VS Code, Waybar, Agents)
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRAM OS 3D Theme Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background-color: #0b0d14;
            color: #cdd6f4;
            font-family: "JetBrains Mono", "SF Pro Display", monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        .glass-panel {
            background: rgba(14, 17, 27, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            pointer-events: auto;
        }
        .hud-top {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            z-index: 10;
        }
        .hud-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .hud-logo {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #00f0ff, #ff007f);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 14px;
            color: #0b0d14;
        }
        .hud-title {
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
        }
        .hud-title span { color: #00f0ff; }
        .hud-subtitle { font-size: 11px; color: #7982a9; }

        /* Left Theme Selector Grid */
        .hud-left {
            position: absolute;
            top: 86px;
            left: 16px;
            bottom: 76px;
            width: 290px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        .theme-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
            margin-top: 10px;
        }
        .theme-list::-webkit-scrollbar { width: 5px; }
        .theme-list::-webkit-scrollbar-thumb { background: #23293e; border-radius: 4px; }
        .theme-card {
            padding: 10px 12px;
            background: rgba(25, 30, 46, 0.6);
            border: 1px solid #23293e;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .theme-card:hover, .theme-card.active {
            background: rgba(0, 240, 255, 0.12);
            border-color: #00f0ff;
            transform: translateX(4px);
        }
        .theme-swatches {
            display: flex;
            gap: 4px;
        }
        .swatch {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Right Material Inspector */
        .hud-right {
            position: absolute;
            top: 86px;
            right: 16px;
            width: 320px;
            padding: 18px;
            z-index: 10;
        }
        .detail-row { margin-bottom: 12px; }
        .detail-label { font-size: 10px; color: #7982a9; text-transform: uppercase; margin-bottom: 4px; }
        .detail-value { font-size: 13px; color: #ffffff; font-weight: 700; }
        .palette-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
        }
        .palette-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #181d2e;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
        }
        .palette-dot {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            margin-right: 8px;
        }

        /* Bottom Action Bar */
        .hud-bottom {
            position: absolute;
            bottom: 16px;
            left: 16px;
            right: 16px;
            padding: 10px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        button {
            background: #181d2e;
            color: #cdd6f4;
            border: 1px solid #28314e;
            border-radius: 6px;
            padding: 7px 14px;
            font-size: 12px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #252d47;
            border-color: #00f0ff;
            color: #ffffff;
        }
        button.primary {
            background: linear-gradient(135deg, #0077ff, #00f0ff);
            color: #07090e;
            border: none;
            box-shadow: 0 4px 18px rgba(0, 240, 255, 0.35);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="hud-top glass-panel">
        <div class="hud-brand">
            <div class="hud-logo">🎨</div>
            <div>
                <div class="hud-title">IRAM OS <span>3D Theme Studio</span></div>
                <div class="hud-subtitle">Interactive 3D Material & Palette Lighting Simulator</div>
            </div>
        </div>
        <div>
            <span style="font-size: 11px; color: #05ffa1; font-weight: 700;">● ZERO-RESTART DESKTOP SYNC</span>
        </div>
    </div>

    <!-- Left Theme Grid -->
    <div class="hud-left glass-panel">
        <div style="font-size: 11px; font-weight: 800; color: #00f0ff; text-transform: uppercase;">
            Curated Themes (<span id="theme-count">18</span>)
        </div>
        <div class="theme-list" id="theme-list-container"></div>
    </div>

    <!-- Right Material Inspector -->
    <div class="hud-right glass-panel">
        <div style="font-size: 11px; font-weight: 800; color: #00f0ff; text-transform: uppercase; margin-bottom: 12px;">
            3D Material Shader
        </div>
        <div class="detail-row">
            <div class="detail-label">Active Theme</div>
            <div class="detail-value" id="theme-name" style="color: #00f0ff;">Tokyo Storm</div>
        </div>
        <div class="detail-row">
            <div class="detail-label">Shading Architecture</div>
            <div class="detail-value">PBR MeshStandard + Emissive Rim</div>
        </div>
        <div class="palette-row" id="palette-details"></div>
    </div>

    <!-- Bottom Controls -->
    <div class="hud-bottom glass-panel">
        <div style="display:flex; gap:10px;">
            <button class="primary" id="btn-apply">
                <span>⚡</span> Apply Theme to Desktop
            </button>
            <button id="btn-rotate" class="active">Auto-Rotate: ON</button>
            <button id="btn-wire">Wireframe: OFF</button>
        </div>
        <div style="font-size: 11px; color: #7982a9;">
            Active Desktop Engine: <strong style="color: #05ffa1;">Hyprland 0.56 + Waybar</strong>
        </div>
    </div>

    <script>
        const THEMES = [
            { id: 'tokyo-storm', name: 'Tokyo Storm', bg: 0x1a1b26, surface: 0x24283b, primary: 0x7aa2f7, accent: 0xbb9af7, success: 0x9ece6a, text: 0xc0caf5 },
            { id: 'cyberpunk-neon', name: 'Cyberpunk Neon', bg: 0x05050d, surface: 0x120d26, primary: 0x00f0ff, accent: 0xff0055, success: 0x05ffa1, text: 0xffffff },
            { id: 'synthwave-84', name: 'Synthwave 84', bg: 0x262335, surface: 0x34294f, primary: 0xff7edb, accent: 0xfe4450, success: 0x72f1b8, text: 0xffffff },
            { id: 'catppuccin-mocha', name: 'Catppuccin Mocha', bg: 0x1e1e2e, surface: 0x313244, primary: 0x89b4fa, accent: 0xcba6f7, success: 0xa6e3a1, text: 0xcdd6f4 },
            { id: 'dracula', name: 'Dracula', bg: 0x282a36, surface: 0x44475a, primary: 0xbd93f9, accent: 0xff79c6, success: 0x50fa7b, text: 0xf8f8f2 },
            { id: 'nord-frost', name: 'Nord Frost', bg: 0x2e3440, surface: 0x3b4252, primary: 0x88c0d0, accent: 0x81a1c1, success: 0xa3be8c, text: 0xe5e9f0 },
            { id: 'rose-pine-moon', name: 'Rose Pine Moon', bg: 0x232136, surface: 0x393552, primary: 0x9ccfd8, accent: 0xeb6f92, success: 0x3e8fb0, text: 0xe0def4 },
            { id: 'one-dark', name: 'One Dark Pro', bg: 0x282c34, surface: 0x353b45, primary: 0x61afef, accent: 0xc678dd, success: 0x98c379, text: 0xabb2bf },
            { id: 'kanagawa-wave', name: 'Kanagawa Wave', bg: 0x1f1f28, surface: 0x2a2a37, primary: 0x7e9cd8, accent: 0x957fb8, success: 0x76946a, text: 0xdcd7ba },
            { id: 'night-owl', name: 'Night Owl', bg: 0x011627, surface: 0x0b2942, primary: 0x82aaff, accent: 0xc792ea, success: 0x22da6e, text: 0xd6deeb },
            { id: 'oxocarbon', name: 'Oxocarbon', bg: 0x161616, surface: 0x262626, primary: 0x33b1ff, accent: 0xff7eb6, success: 0x42be65, text: 0xf4f4f4 },
            { id: 'vesper', name: 'Vesper', bg: 0x101010, surface: 0x1c1c1c, primary: 0xffc799, accent: 0xff5c57, success: 0x99ffe4, text: 0xffffff },
            { id: 'ayu-mirage', name: 'Ayu Mirage', bg: 0x1f2430, surface: 0x242936, primary: 0x73d0ff, accent: 0xffcc66, success: 0xbae67e, text: 0xcbccc6 },
            { id: 'material-ocean', name: 'Material Ocean', bg: 0x0f111a, surface: 0x1a1c25, primary: 0x82aaff, accent: 0x89ddff, success: 0xc3e88d, text: 0x8f93a2 },
            { id: 'aura-dark', name: 'Aura Dark', bg: 0x15141b, surface: 0x21202e, primary: 0xa277ff, accent: 0xf694ff, success: 0x61ffca, text: 0xedecee },
            { id: 'monokai-pro', name: 'Monokai Pro', bg: 0x2d2a2e, surface: 0x403e41, primary: 0x78dce8, accent: 0xff6188, success: 0xa9dc76, text: 0xfcfcfa },
            { id: 'solarized-dark', name: 'Solarized Dark', bg: 0x002b36, surface: 0x073642, primary: 0x268bd2, accent: 0xd33682, success: 0x859900, text: 0x839496 },
            { id: 'ryoku-crimson', name: 'Ryoku Crimson', bg: 0x0d1117, surface: 0x161b22, primary: 0xff1744, accent: 0x00e676, success: 0x00e5ff, text: 0xf0f6fc }
        ];

        let scene, camera, renderer, controls;
        let activeTheme = THEMES[0];
        let torusMesh, sphereMesh, floorGrid, pointLight1, pointLight2;
        let autoRotate = true;
        let isWire = false;

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(activeTheme.bg, 0.015);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 26);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Lights
            scene.add(new THREE.AmbientLight(0xffffff, 0.4));
            pointLight1 = new THREE.PointLight(activeTheme.primary, 2.5, 60);
            pointLight1.position.set(12, 16, 12);
            scene.add(pointLight1);

            pointLight2 = new THREE.PointLight(activeTheme.accent, 2.0, 60);
            pointLight2.position.set(-12, -10, -10);
            scene.add(pointLight2);

            // Geometries
            build3DScene();
            populateThemeList();
            updateShaderDetails();

            // Listeners
            window.addEventListener('resize', onResize);
            document.getElementById('btn-rotate').onclick = (e) => {
                autoRotate = !autoRotate;
                e.target.textContent = autoRotate ? 'Auto-Rotate: ON' : 'Auto-Rotate: OFF';
            };
            document.getElementById('btn-wire').onclick = (e) => {
                isWire = !isWire;
                torusMesh.material.wireframe = isWire;
                sphereMesh.material.wireframe = isWire;
                e.target.textContent = isWire ? 'Wireframe: ON' : 'Wireframe: OFF';
            };
            document.getElementById('btn-apply').onclick = applyCurrentTheme;

            animate();
        }

        function build3DScene() {
            // Main Torus Knot (Primary Accent)
            const torusGeom = new THREE.TorusKnotGeometry(5.5, 1.8, 128, 32);
            const torusMat = new THREE.MeshStandardMaterial({
                color: activeTheme.primary,
                emissive: activeTheme.primary,
                emissiveIntensity: 0.25,
                metalness: 0.6,
                roughness: 0.2
            });
            torusMesh = new THREE.Mesh(torusGeom, torusMat);
            torusMesh.position.set(-3, 2, 0);
            scene.add(torusMesh);

            // Translucent Orbital Glass Sphere (Secondary Accent)
            const sphereGeom = new THREE.SphereGeometry(3.2, 32, 32);
            const sphereMat = new THREE.MeshPhysicalMaterial({
                color: activeTheme.accent,
                emissive: activeTheme.accent,
                emissiveIntensity: 0.15,
                metalness: 0.1,
                roughness: 0.1,
                transparent: true,
                opacity: 0.8
            });
            sphereMesh = new THREE.Mesh(sphereGeom, sphereMat);
            sphereMesh.position.set(8, -1, 3);
            scene.add(sphereMesh);

            // Cyber Floor Grid
            floorGrid = new THREE.GridHelper(80, 40, activeTheme.primary, activeTheme.surface);
            floorGrid.position.y = -8;
            scene.add(floorGrid);
        }

        function populateThemeList() {
            const container = document.getElementById('theme-list-container');
            container.innerHTML = '';
            THEMES.forEach(t => {
                const card = document.createElement('div');
                card.className = 'theme-card' + (t.id === activeTheme.id ? ' active' : '');
                card.innerHTML = `
                    <span style="font-size:12px; font-weight:700;">${t.name}</span>
                    <div class="theme-swatches">
                        <div class="swatch" style="background:#${t.bg.toString(16).padStart(6,'0')}"></div>
                        <div class="swatch" style="background:#${t.primary.toString(16).padStart(6,'0')}"></div>
                        <div class="swatch" style="background:#${t.accent.toString(16).padStart(6,'0')}"></div>
                    </div>
                `;
                card.onclick = () => selectTheme(t);
                container.appendChild(card);
            });
        }

        function selectTheme(theme) {
            activeTheme = theme;
            populateThemeList();
            updateShaderDetails();

            // Smoothly update 3D materials and lighting
            torusMesh.material.color.setHex(theme.primary);
            torusMesh.material.emissive.setHex(theme.primary);

            sphereMesh.material.color.setHex(theme.accent);
            sphereMesh.material.emissive.setHex(theme.accent);

            pointLight1.color.setHex(theme.primary);
            pointLight2.color.setHex(theme.accent);

            scene.fog.color.setHex(theme.bg);
            renderer.setClearColor(theme.bg, 1);
        }

        function updateShaderDetails() {
            document.getElementById('theme-name').textContent = activeTheme.name;
            const container = document.getElementById('palette-details');
            container.innerHTML = `
                <div class="palette-item">
                    <div style="display:flex;align-items:center;">
                        <div class="palette-dot" style="background:#${activeTheme.bg.toString(16).padStart(6,'0')}"></div>
                        <span>Background (Canvas Fog)</span>
                    </div>
                    <strong>#${activeTheme.bg.toString(16).padStart(6,'0')}</strong>
                </div>
                <div class="palette-item">
                    <div style="display:flex;align-items:center;">
                        <div class="palette-dot" style="background:#${activeTheme.primary.toString(16).padStart(6,'0')}"></div>
                        <span>Primary Accent (Torus PBR)</span>
                    </div>
                    <strong style="color:#00f0ff;">#${activeTheme.primary.toString(16).padStart(6,'0')}</strong>
                </div>
                <div class="palette-item">
                    <div style="display:flex;align-items:center;">
                        <div class="palette-dot" style="background:#${activeTheme.accent.toString(16).padStart(6,'0')}"></div>
                        <span>Secondary Glow (Glass Sphere)</span>
                    </div>
                    <strong>#${activeTheme.accent.toString(16).padStart(6,'0')}</strong>
                </div>
                <div class="palette-item">
                    <div style="display:flex;align-items:center;">
                        <div class="palette-dot" style="background:#${activeTheme.success.toString(16).padStart(6,'0')}"></div>
                        <span>Telemetry Highlight</span>
                    </div>
                    <strong style="color:#05ffa1;">#${activeTheme.success.toString(16).padStart(6,'0')}</strong>
                </div>
            `;
        }

        function applyCurrentTheme() {
            const btn = document.getElementById('btn-apply');
            btn.innerHTML = '<span>⏳</span> Applying to Hyprland...';
            // Send request to local server or call CLI
            fetch(`/api/set-theme?id=${activeTheme.id}`)
                .then(() => {
                    btn.innerHTML = '<span>✓</span> Theme Applied!';
                    setTimeout(() => btn.innerHTML = '<span>⚡</span> Apply Theme to Desktop', 2000);
                })
                .catch(() => {
                    btn.innerHTML = '<span>✓</span> Palette Selected';
                    setTimeout(() => btn.innerHTML = '<span>⚡</span> Apply Theme to Desktop', 2000);
                });
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (autoRotate) {
                torusMesh.rotation.y += 0.008;
                torusMesh.rotation.x += 0.004;
                sphereMesh.rotation.y -= 0.01;
            }
            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>

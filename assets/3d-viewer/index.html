<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRAM OS 3D Studio & Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background-color: #14161f;
            color: #cdd6f4;
            font-family: "JetBrains Mono", "SF Pro Display", monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        .hud-overlay {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 10;
            background: rgba(20, 22, 31, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 8px;
            padding: 14px 18px;
            pointer-events: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .hud-title {
            font-size: 14px;
            font-weight: 800;
            color: #00f0ff;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .hud-subtitle {
            font-size: 11px;
            color: #a6adc8;
            margin-bottom: 12px;
        }
        .controls-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        button, select {
            background: #1e2233;
            color: #cdd6f4;
            border: 1px solid #33394f;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        button:hover, select:hover {
            background: #293049;
            border-color: #00f0ff;
            color: #ffffff;
        }
        button.active {
            background: #00f0ff;
            color: #0d0f18;
            font-weight: 800;
            border-color: #00f0ff;
        }
        .dropzone-hint {
            font-size: 11px;
            color: #6c7086;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stats-badge {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: rgba(20, 22, 31, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 11px;
            color: #a6adc8;
            z-index: 10;
        }
        .stats-badge span {
            color: #05ffa1;
            font-weight: bold;
        }
    </style>
    <!-- Three.js + OrbitControls + STLLoader from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
</head>
<body>
    <div class="hud-overlay">
        <div class="hud-title">⚡ IRAM 3D Studio (Three.js)</div>
        <div class="hud-subtitle">Interactive WebGL Mesh & CAD Inspector</div>
        <div class="controls-row">
            <select id="model-select">
                <option value="torus">Torus Knot (Parametric)</option>
                <option value="dna">DNA Double Helix (Biomolecule)</option>
                <option value="rack">Laboratory Tube Rack (CADCraft)</option>
                <option value="cyber">Cyberpunk Node Mesh</option>
            </select>
            <button id="btn-wireframe">Wireframe</button>
            <button id="btn-rotate" class="active">Auto-Rotate</button>
        </div>
        <div class="controls-row">
            <button id="btn-theme-cyan">Cyan</button>
            <button id="btn-theme-crimson">Crimson</button>
            <button id="btn-theme-emerald">Emerald</button>
            <button id="btn-theme-gold">Gold</button>
        </div>
        <div class="dropzone-hint">📁 Drag & Drop local .STL or .OBJ file to inspect</div>
    </div>

    <div class="stats-badge">
        Renderer: <span id="stat-engine">WebGL</span> | Polys: <span id="stat-poly">0</span> | FPS: <span id="stat-fps">60</span>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, controls;
        let currentMesh = null;
        let isWireframe = false;
        let autoRotate = true;
        let activeColor = 0x00f0ff;

        function init() {
            const container = document.getElementById('canvas-container');

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x14161f);
            scene.fog = new THREE.FogExp2(0x14161f, 0.015);

            // Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(20, 20, 35);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // OrbitControls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0x00f0ff, 1.2);
            dirLight1.position.set(20, 40, 20);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0xff0055, 0.8);
            dirLight2.position.set(-20, -20, -20);
            scene.add(dirLight2);

            // Grid Floor
            const gridHelper = new THREE.GridHelper(60, 40, 0x00f0ff, 0x282c3f);
            gridHelper.position.y = -8;
            scene.add(gridHelper);

            // Load model from URL or fallback to initial preset
            const urlParams = new URLSearchParams(window.location.search);
            const fileParam = urlParams.get('file');
            if (fileParam) {
                loadModelFromUrl(fileParam);
            } else {
                loadPrimitive('dna');
            }

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            setupUI();
            setupDragAndDrop();

            animate();
        }

        function loadModelFromUrl(url) {
            const ext = url.split('.').pop().toLowerCase();
            if (ext === 'stl') {
                const loader = new THREE.STLLoader();
                loader.load(url, (geometry) => {
                    geometry.center();
                    if (currentMesh) scene.remove(currentMesh);
                    currentMesh = new THREE.Mesh(geometry, createMaterial());
                    currentMesh.scale.set(0.5, 0.5, 0.5);
                    scene.add(currentMesh);
                    updateStats(geometry.attributes.position.count);
                });
            } else if (ext === 'obj') {
                const loader = new THREE.OBJLoader();
                loader.load(url, (obj) => {
                    if (currentMesh) scene.remove(currentMesh);
                    obj.traverse((child) => {
                        if (child.isMesh) child.material = createMaterial();
                    });
                    currentMesh = obj;
                    scene.add(currentMesh);
                    let polys = 0;
                    obj.traverse((child) => { if (child.isMesh && child.geometry) polys += child.geometry.attributes.position.count; });
                    updateStats(polys);
                });
            }
        }

        function createMaterial() {
            return new THREE.MeshStandardMaterial({
                color: activeColor,
                metalness: 0.3,
                roughness: 0.2,
                wireframe: isWireframe,
                emissive: activeColor,
                emissiveIntensity: 0.15
            });
        }

        function loadPrimitive(type) {
            if (currentMesh) scene.remove(currentMesh);

            let geom;
            if (type === 'torus') {
                geom = new THREE.TorusKnotGeometry(7, 2.2, 128, 32);
            } else if (type === 'dna') {
                // Procedural DNA Double Helix
                const group = new THREE.Group();
                const mat = createMaterial();
                const beadMat = new THREE.MeshStandardMaterial({ color: 0xff0055, roughness: 0.3 });
                for (let i = -15; i <= 15; i++) {
                    const angle = i * 0.3;
                    const r = 5;
                    const y = i * 0.9;
                    const s1 = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), mat);
                    s1.position.set(Math.cos(angle) * r, y, Math.sin(angle) * r);
                    const s2 = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), beadMat);
                    s2.position.set(-Math.cos(angle) * r, y, -Math.sin(angle) * r);
                    const barGeom = new THREE.CylinderGeometry(0.15, 0.15, r * 2, 8);
                    const bar = new THREE.Mesh(barGeom, new THREE.MeshBasicMaterial({ color: 0x565f89 }));
                    bar.position.set(0, y, 0);
                    bar.rotation.z = Math.PI / 2;
                    bar.rotation.y = -angle;
                    group.add(s1);
                    group.add(s2);
                    group.add(bar);
                }
                currentMesh = group;
                scene.add(currentMesh);
                updateStats(1200);
                return;
            } else if (type === 'rack') {
                // Parametric Lab Tube Rack
                const group = new THREE.Group();
                const baseGeom = new THREE.BoxGeometry(16, 1.2, 10);
                const rackMat = createMaterial();
                const base = new THREE.Mesh(baseGeom, rackMat);
                base.position.y = -5;
                const top = new THREE.Mesh(baseGeom, rackMat);
                top.position.y = 2;
                group.add(base);
                group.add(top);

                // Posts & Tube representations
                for (let x = -6; x <= 6; x += 4) {
                    for (let z = -3; z <= 3; z += 3) {
                        const tubeGeom = new THREE.CylinderGeometry(1.2, 1.2, 8, 16);
                        const tubeMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.6, roughness: 0.1 });
                        const tube = new THREE.Mesh(tubeGeom, tubeMat);
                        tube.position.set(x, -1, z);
                        group.add(tube);
                    }
                }
                currentMesh = group;
                scene.add(currentMesh);
                updateStats(850);
                return;
            } else {
                geom = new THREE.IcosahedronGeometry(8, 2);
            }

            currentMesh = new THREE.Mesh(geom, createMaterial());
            scene.add(currentMesh);
            updateStats(geom.attributes.position.count);
        }

        function updateStats(polyCount) {
            document.getElementById('stat-poly').textContent = Number(polyCount).toLocaleString();
        }

        function setupUI() {
            document.getElementById('model-select').addEventListener('change', (e) => {
                loadPrimitive(e.target.value);
            });

            const btnWire = document.getElementById('btn-wireframe');
            btnWire.addEventListener('click', () => {
                isWireframe = !isWireframe;
                btnWire.classList.toggle('active', isWireframe);
                if (currentMesh) {
                    currentMesh.traverse((child) => {
                        if (child.isMesh) child.material.wireframe = isWireframe;
                    });
                }
            });

            const btnRotate = document.getElementById('btn-rotate');
            btnRotate.addEventListener('click', () => {
                autoRotate = !autoRotate;
                btnRotate.classList.toggle('active', autoRotate);
            });

            // Color buttons
            const colors = {
                'btn-theme-cyan': 0x00f0ff,
                'btn-theme-crimson': 0xff0055,
                'btn-theme-emerald': 0x05ffa1,
                'btn-theme-gold': 0xffb800
            };
            for (const [id, hex] of Object.entries(colors)) {
                document.getElementById(id).addEventListener('click', () => {
                    activeColor = hex;
                    if (currentMesh) {
                        currentMesh.traverse((child) => {
                            if (child.isMesh && child.material) {
                                child.material.color.setHex(hex);
                                if (child.material.emissive) child.material.emissive.setHex(hex);
                            }
                        });
                    }
                });
            }
        }

        function setupDragAndDrop() {
            window.addEventListener('dragover', (e) => e.preventDefault());
            window.addEventListener('drop', (e) => {
                e.preventDefault();
                if (e.dataTransfer.files.length > 0) {
                    const file = e.dataTransfer.files[0];
                    const reader = new FileReader();
                    const ext = file.name.split('.').pop().toLowerCase();

                    if (ext === 'stl') {
                        reader.readAsArrayBuffer(file);
                        reader.onload = function(evt) {
                            const loader = new THREE.STLLoader();
                            const geometry = loader.parse(evt.target.result);
                            geometry.center();
                            if (currentMesh) scene.remove(currentMesh);
                            currentMesh = new THREE.Mesh(geometry, createMaterial());
                            currentMesh.scale.set(0.5, 0.5, 0.5);
                            scene.add(currentMesh);
                            updateStats(geometry.attributes.position.count);
                        };
                    } else if (ext === 'obj') {
                        reader.readAsText(file);
                        reader.onload = function(evt) {
                            const loader = new THREE.OBJLoader();
                            const obj = loader.parse(evt.target.result);
                            if (currentMesh) scene.remove(currentMesh);
                            obj.traverse((child) => {
                                if (child.isMesh) child.material = createMaterial();
                            });
                            currentMesh = obj;
                            scene.add(currentMesh);
                            let polys = 0;
                            obj.traverse((child) => { if (child.isMesh && child.geometry) polys += child.geometry.attributes.position.count; });
                            updateStats(polys);
                        };
                    }
                }
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        let frameCount = 0;
        let lastTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);

            if (autoRotate && currentMesh) {
                currentMesh.rotation.y += 0.008;
                currentMesh.rotation.x += 0.003;
            }

            controls.update();
            renderer.render(scene, camera);

            // FPS Counter
            frameCount++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                document.getElementById('stat-fps').textContent = frameCount;
                frameCount = 0;
                lastTime = now;
            }
        }

        window.onload = init;
    </script>
</body>
</html>

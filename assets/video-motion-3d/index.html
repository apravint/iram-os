<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRAM OS 3D Motion Graphics & Intro Studio</title>
    
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Three.js + OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        :root {
            --bg-main: #07090e;
            --bg-surface: rgba(16, 20, 32, 0.78);
            --bg-surface-elevated: rgba(24, 30, 48, 0.88);
            --bg-input: rgba(20, 26, 42, 0.85);
            --accent-primary: #00f0ff;
            --accent-secondary: #ff0055;
            --accent-success: #05ffa1;
            --text-main: #f0f4fc;
            --text-muted: #8b95b5;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(0, 240, 255, 0.28);
            --card-radius: 14px;
            --glow-shadow: 0 16px 44px rgba(0, 0, 0, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .glass-panel {
            background: var(--bg-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: var(--card-radius);
            box-shadow: var(--glow-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            pointer-events: auto;
            position: relative;
            z-index: 10;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* Top HUD Bar */
        .hud-top {
            position: absolute;
            top: 14px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 22px;
        }
        .hud-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .hud-logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #ffffff;
            box-shadow: 0 0 16px var(--border-glow);
        }
        .hud-title {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: -0.2px;
            color: var(--text-main);
        }
        .hud-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
            font-family: 'JetBrains Mono', monospace;
        }
        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(5, 255, 161, 0.12);
            border: 1px solid rgba(5, 255, 161, 0.35);
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 700;
            color: var(--accent-success);
            font-family: 'JetBrains Mono', monospace;
            transition: color 0.3s ease, border-color 0.3s ease;
        }

        /* Left Floating Director Controls */
        .hud-left {
            position: absolute;
            top: 82px;
            left: 16px;
            width: 340px;
            padding: 18px;
        }
        .form-row {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 6px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.5px;
        }
        input, select {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 12px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        input:focus, select:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 12px var(--border-glow);
        }

        button {
            background: var(--bg-surface-elevated);
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 9px 16px;
            font-size: 12px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--accent-primary);
            color: #ffffff;
            transform: translateY(-1px);
        }
        button:focus-visible {
            outline: 2px solid var(--accent-primary);
            outline-offset: 2px;
        }
        button.record {
            background: linear-gradient(135deg, #ff0055, #ff5500);
            color: #ffffff;
            border: none;
            font-weight: 800;
            box-shadow: 0 4px 20px rgba(255, 0, 85, 0.4);
            min-height: 42px;
        }
        button.record:hover {
            box-shadow: 0 6px 26px rgba(255, 0, 85, 0.6);
        }
        button.record.active {
            animation: pulse-record 1.2s infinite ease-in-out;
            background: #ff0055;
        }
        @keyframes pulse-record {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.75; transform: scale(0.98); }
        }

        /* Bottom HUD */
        .hud-bottom {
            position: absolute;
            bottom: 14px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- Top HUD Bar -->
    <div class="hud-top glass-panel">
        <div class="hud-brand">
            <div class="hud-logo">🎬</div>
            <div>
                <div class="hud-title">IRAM 3D Motion Graphics & Film Studio</div>
                <div class="hud-subtitle">Cinematic WebGL Title Sequences for iram-video & Shorts</div>
            </div>
        </div>
        <div class="status-pill" id="record-status-pill">
            <span style="display:inline-block;width:7px;height:7px;background:var(--accent-success);border-radius:50%;box-shadow:0 0 8px var(--accent-success);"></span>
            <span id="record-status">READY TO RENDER</span>
        </div>
    </div>

    <!-- Left Director Controls -->
    <div class="hud-left glass-panel">
        <div class="form-row">
            <label>Title Headline</label>
            <input type="text" id="input-title" value="IRAM OS v26.10">
        </div>
        <div class="form-row">
            <label>Subhead / Hook</label>
            <input type="text" id="input-subhead" value="AUTONOMOUS SPATIAL DESKTOP">
        </div>
        <div class="form-row">
            <label>Cinematic Camera Recipe</label>
            <select id="select-recipe">
                <option value="hero-sweep">Hero Reveal (Orbital Sweep)</option>
                <option value="cyber-crash">Cyber Crash-Zoom</option>
                <option value="macro-drift">Macro Floating Drift</option>
                <option value="matrix-spiral">Matrix Spiral Flythrough</option>
            </select>
        </div>
        <div class="form-row">
            <label>Neon Lighting Core</label>
            <select id="select-color">
                <option value="cyan">Cyberpunk Cyan (#00f0ff)</option>
                <option value="crimson">Crimson Neon (#ff0055)</option>
                <option value="gold">Cinema Gold (#ffb800)</option>
                <option value="emerald">Matrix Emerald (#05ffa1)</option>
                <option value="purple">Cosmic Purple (#b800ff)</option>
            </select>
        </div>
        <div class="form-row">
            <label>Aspect Ratio</label>
            <select id="select-aspect">
                <option value="16:9">16:9 Widescreen (YouTube / Cinema)</option>
                <option value="9:16">9:16 Vertical (Shorts / Reels)</option>
            </select>
        </div>
        <button class="record" id="btn-record" style="width:100%; margin-top:6px;">
            ⏺ Record 3D Video Clip (5s WebM/MP4)
        </button>
    </div>

    <!-- Bottom HUD -->
    <div class="hud-bottom glass-panel">
        <div style="font-size:11px; color:var(--text-muted); font-family:'JetBrains Mono', monospace;">
            Integration: Connects directly with <strong style="color:var(--accent-primary);">iram-video --recipe</strong> & FFMPEG
        </div>
        <div style="font-size:11px; color:var(--text-main); font-family:'JetBrains Mono', monospace;">
            Output: <span id="stat-res" style="color:var(--accent-success); font-weight:700;">1920x1080 @ 60 FPS</span>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let titleGroup, particlesMesh, gridFloor;
        let pointLight1, pointLight2;
        let isRecording = false;
        let mediaRecorder, recordedChunks = [];

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x07090e, 0.015);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, 22);

            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            pointLight1 = new THREE.PointLight(0x00f0ff, 3, 60);
            pointLight1.position.set(10, 15, 10);
            scene.add(pointLight1);

            pointLight2 = new THREE.PointLight(0xff0055, 2, 60);
            pointLight2.position.set(-10, -10, 10);
            scene.add(pointLight2);

            gridFloor = new THREE.GridHelper(80, 40, 0x00f0ff, 0x1f263d);
            gridFloor.position.y = -6;
            scene.add(gridFloor);

            buildParticleField();
            buildTitle3D();

            window.addEventListener('resize', onResize);
            document.getElementById('input-title').oninput = updateTitle;
            document.getElementById('input-subhead').oninput = updateTitle;
            document.getElementById('select-color').onchange = updateColor;
            document.getElementById('select-aspect').onchange = updateAspect;
            document.getElementById('btn-record').onclick = toggleRecord;

            syncTheme();
            animate();
        }

        function buildParticleField() {
            const count = 800;
            const geom = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i++) pos[i] = (Math.random() - 0.5) * 100;
            geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            particlesMesh = new THREE.Points(geom, new THREE.PointsMaterial({
                size: 0.8, color: 0x00f0ff, transparent: true, opacity: 0.6
            }));
            scene.add(particlesMesh);
        }

        function buildTitle3D() {
            titleGroup = new THREE.Group();

            const plateGeom = new THREE.BoxGeometry(16, 5.5, 0.6);
            const plateMat = new THREE.MeshStandardMaterial({
                color: 0x0d111d,
                metalness: 0.8,
                roughness: 0.2,
                emissive: 0x00f0ff,
                emissiveIntensity: 0.1
            });
            const plate = new THREE.Mesh(plateGeom, plateMat);
            titleGroup.add(plate);

            const ringGeom = new THREE.TorusGeometry(5, 0.15, 16, 64);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
            const ring = new THREE.Mesh(ringGeom, ringMat);
            ring.rotation.x = Math.PI / 2;
            titleGroup.add(ring);
            titleGroup.ring = ring;

            scene.add(titleGroup);
        }

        function updateTitle() {
            const text = document.getElementById('input-title').value;
            titleGroup.scale.set(1 + text.length * 0.02, 1, 1);
        }

        function updateColor(e) {
            const val = e.target.value;
            const colors = {
                cyan: 0x00f0ff,
                crimson: 0xff0055,
                gold: 0xffb800,
                emerald: 0x05ffa1,
                purple: 0xb800ff
            };
            const hex = colors[val] || 0x00f0ff;
            pointLight1.color.setHex(hex);
            titleGroup.ring.material.color.setHex(hex);
            particlesMesh.material.color.setHex(hex);
        }

        function updateAspect(e) {
            const aspect = e.target.value;
            const resEl = document.getElementById('stat-res');
            if (aspect === '9:16') {
                resEl.textContent = '1080x1920 (Vertical Shorts) @ 60 FPS';
            } else {
                resEl.textContent = '1920x1080 (16:9 Cinema) @ 60 FPS';
            }
        }

        function toggleRecord() {
            if (isRecording) return;
            isRecording = true;
            const btn = document.getElementById('btn-record');
            const status = document.getElementById('record-status');
            const statusPill = document.getElementById('record-status-pill');

            btn.classList.add('active');
            btn.textContent = 'Recording 3D Motion (5s)...';
            status.textContent = 'RECORDING STREAM...';
            statusPill.style.color = '#ff0055';
            statusPill.style.borderColor = 'rgba(255, 0, 85, 0.4)';

            const stream = renderer.domElement.captureStream(60);
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
            recordedChunks = [];

            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `iram_3d_intro_${Date.now()}.webm`;
                a.click();
                btn.classList.remove('active');
                btn.textContent = '⏺ Record 3D Video Clip (5s WebM/MP4)';
                status.textContent = 'RENDER SAVED TO DOWNLOADS';
                statusPill.style.color = 'var(--accent-success)';
                statusPill.style.borderColor = 'rgba(5, 255, 161, 0.35)';
                isRecording = false;
            };

            mediaRecorder.start();
            setTimeout(() => mediaRecorder.stop(), 5000);
        }

        function syncTheme() {
            fetch('http://127.0.0.1:8990/api/theme')
                .then(r => r.json())
                .then(data => {
                    if (data.ok && data.colors) {
                        const c = data.colors;
                        const root = document.documentElement;
                        const bgMain = c.darker_background || c.background || '#07090e';
                        const accent = c.accent || '#00f0ff';
                        const success = c.green || '#05ffa1';

                        root.style.setProperty('--bg-main', bgMain);
                        root.style.setProperty('--accent-primary', accent);
                        root.style.setProperty('--accent-success', success);
                        root.style.setProperty('--border-glow', `${accent}44`);

                        scene.fog.color.set(bgMain);
                    }
                })
                .catch(() => {});
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            if (titleGroup) {
                titleGroup.rotation.y = Math.sin(time) * 0.15;
                if (titleGroup.ring) titleGroup.ring.rotation.z += 0.02;
            }
            if (particlesMesh) particlesMesh.rotation.y += 0.002;

            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>

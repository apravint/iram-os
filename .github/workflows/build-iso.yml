name: Build & Release IRAM OS Live ISO

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v26.10.0 or v26.04.0)'
        required: true
        default: 'v26.04.3'
      base_codename:
        description: 'Target base codename (resolute LTS or stonking)'
        required: true
        default: 'resolute'
      distro_version:
        description: 'Target distro version (26.04 or 26.10)'
        required: true
        default: '26.04'
      publish_release:
        description: 'Publish the ISO as a GitHub Release (leave false for a test build)'
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  build-iso:
    name: Build Bootable Live ISO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install ISO Build Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            binutils \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            isolinux \
            syslinux-utils \
            zstd \
            xz-utils \
            qemu-system-x86 \
            ovmf

      - name: Run ISO Builder
        env:
          BASE_CODENAME: ${{ github.event.inputs.base_codename || 'resolute' }}
          DISTRO_VERSION: ${{ github.event.inputs.distro_version || '26.04' }}
        run: |
          sudo -E bash build/build-iso.sh

      - name: List Generated Artifacts
        run: |
          sudo chown -R "$(id -u):$(id -g)" out/
          ls -lh out/

      - name: Verify ISO Integrity & Headless Smoke Boot
        run: |
          sudo bash build/verify-iso.sh

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iram-os-Live-ISO
          path: |
            out/*.iso
            out/sha256sum.txt
          retention-days: 14

      - name: End-to-End Install Test in a VM
        run: |
          sudo apt-get install -y imagemagick
          sudo python3 build/vm-install-test.py out/iram-os-*.iso --out vm-test-results

      - name: Upload VM Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-test-results
          path: vm-test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Attach ISO to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || inputs.publish_release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.version || github.ref_name }}
          name: ${{ github.event.release.name || format('IRAM OS {0}', github.event.inputs.version || github.ref_name) }}
          body: |
            # 🚀 IRAM OS Live ISO Release

            Welcome to the official release of **IRAM OS** — the turnkey agentic Hyprland + Waybar desktop operating system.

            ### 📦 Download Links
            - **Live ISO Image**: Available in the release assets below (`iram-os-*.iso`).
            - **Checksum**: Verify the SHA256 checksum against `sha256sum.txt`.

            ### 💻 How to Flash & Boot
            1. Download the `.iso` file.
            2. Flash to a USB drive using [BalenaEtcher](https://etcher.balena.io/), [Ventoy](https://www.ventoy.net/), or [Rufus](https://rufus.ie/).
            3. Boot your PC, choose your USB drive in the boot menu (`F12`, `F11`, or `Esc`).
            4. Default Live Session Credentials:
               - **User**: `iram`
               - **Password**: `iram` *(Passwordless sudo applies to the live session only. `sudo iram-install-disk` creates your own user and removes this one.)*

            ### ✨ Key Features
            - Pre-configured Hyprland Wayland compositor with fluid animations
            - Dual-monitor auto-detection with GUI manager (`iram-displays-gui`)
            - Out-of-the-box PipeWire audio routing
            - Persistent Waybar & wallpaper services with 0 collisions
            - 55 built-in themes with live switching (`iram theme`)
          files: |
            out/*.iso
            out/sha256sum.txt
          draft: false
          prerelease: false

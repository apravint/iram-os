name: IRAM OS CI Quality & Syntax Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Lint, Syntax & Dry-Run Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Lint & Validation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck zstd libgtk-3-bin apt-utils

      - name: Run Test Suite (tests/run.sh)
        run: bash tests/run.sh

      - name: Ruff (Python syntax errors and undefined names)
        run: |
          pip install ruff
          ruff check --select E9,F63,F7,F82 .

      - name: ShellCheck (errors fail the build)
        run: |
          shellcheck -S error install.sh build/*.sh migrations/*.sh tests/run.sh \
            $(grep -lE '^#!.*(ba)?sh' bin/*)

      - name: Build Debian Packages
        run: |
          bash build/package-deb.sh
          for deb in out/*.deb; do dpkg-deb --info "$deb" > /dev/null; done

      - name: Verify Shell Scripts Syntax (bash -n)
        run: |
          echo "==> Checking syntax for install.sh and root scripts..."
          bash -n install.sh
          if [ -f uninstall.sh ]; then bash -n uninstall.sh; fi

          echo "==> Checking syntax across all scripts in bin/ and build/..."
          failed=0
          for script in bin/* build/*.sh; do
            if [ -f "$script" ] && [ ! -L "$script" ]; then
              shebang=$(head -n 1 "$script")
              if [[ "$shebang" =~ (bash|sh) ]]; then
                if ! bash -n "$script"; then
                  echo "Syntax error in $script"
                  failed=$((failed + 1))
                fi
              fi
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "Failed: $failed shell script(s) had syntax errors!"
            exit 1
          fi
          echo "✓ All shell scripts passed syntax checks cleanly."

      - name: Verify Python Scripts (py_compile)
        run: |
          echo "==> Compiling Python scripts..."
          if [ -f "mcp/iram-os-mcp" ]; then python3 -m py_compile mcp/iram-os-mcp; fi
          for py_script in bin/*.py bin/iram-theme-sync-all bin/iram-waybar-ai bin/iram-welcome bin/iram-mcp-config bin/iram-os-mcp bin/iram-context bin/iram-ai-tune bin/iram-theme-color build/*.py; do
            if [ -f "$py_script" ]; then
              python3 -m py_compile "$py_script"
            fi
          done
          echo "✓ All Python scripts compiled without error."

      - name: Execute Installer Dry-Run Test
        run: |
          echo "==> Testing installer dry-run simulation..."
          bash ./install.sh --dry-run
          echo "✓ Installer dry-run executed successfully."

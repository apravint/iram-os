# ==============================================================================
# Iram Hyprland Configuration (Quattro Edition)
# ==============================================================================

# Default fallback display rule (portable across laptops, VMs, and custom monitors)
monitor = , preferred, auto, 1

# Hardware profile generated at login by iram-gpu-env (cursor & VM rendering)
source = ~/.config/hypr/gpu.conf

# Optional machine-specific monitor layout & workspace assignments
# Managed dynamically via 'iram display' / 'iram-displays-gui'
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/webapps.conf

# Smart Gaps & Dynamic Single-Window Focus Mode
workspace = w[tv1], gapsout:0, gapsin:0, border:false
workspace = f[1], gapsout:0, gapsin:0, border:false

# Quake-style Top-Sliding Drop-down Scratchpad Console (Upstream Omarchy 4.5 standard)
workspace = special:scratchpad, gapsin:0, gapsout:0 140 220 140, border:false, on-created-empty:alacritty --class iram-agent-console -e iram-ai-launch
windowrule = rounding 0, match:class ^(iram-agent-console)$


# Autostart essential Daemons & Iram System Services
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_DATA_DIRS,$HOME/.local/share:$HOME/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share:/var/lib/snapd/desktop
env = TERMINAL,alacritty
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Waybar, wallpaper, notifications, clipboard, idle and polkit are systemd user
# units under hyprland-session.target. Do not also start them here: each would run twice.
exec-once = ~/.local/bin/iram-session-bootstrap
exec-shutdown = systemctl --user stop hyprland-session.target

exec-once = ~/.local/bin/iram-theme-sync-all
source = ~/.config/hypr/cursor.conf
# Audio Output Persistence (Guaranteed HDMI Default & Unmute)
exec-once = ~/.local/bin/iram-audio-init

# First-Boot Interactive Onboarding Guide
exec-once = [ ! -f "$HOME/.config/iram-os/.welcomed" ] && ~/.local/bin/iram-welcome

# Input Devices
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
    sensitivity = 0
}

# Window Layout and Gaps
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(24283baa)
    layout = dwindle
    allow_tearing = false
    resize_on_border = true
    extend_border_grab_area = 8
    hover_icon_on_border = true
}

# Optional Layout Override (Tiling vs Traditional Floating Mode)
source = ~/.config/hypr/layout.conf
source = ~/.config/hypr/workspaces-layout.conf


# Active Theme Border & Aesthetic Override
source = ~/.config/hypr/theme.conf

# Iram Visual Aesthetics (Sharp Square Edges, Glassmorphic Acrylic & Kawase Blur)
decoration {
    rounding = 0
    dim_inactive = true
    dim_strength = 0.10
    dim_special = 0.60
    active_opacity = 1.0
    inactive_opacity = 0.94

    blur {
        enabled = true
        size = 7
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
        noise = 0.0117
        contrast = 0.9
        brightness = 0.85
        vibrancy = 0.20
        popups = true
    }
    shadow {
        enabled = false
    }
}

# Sovereign Appearance & Rice Tuner Overrides (Managed dynamically via iram-appearance)
source = ~/.config/hypr/appearance.conf

# Ultra-Smooth Fluid Spring Animations
animations {
    enabled = true
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    bezier = fluid, 0.16, 1, 0.3, 1
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0, 0.35, 1

    animation = windows, 1, 4, wind
    animation = windowsIn, 1, 4, winIn, popin 85%
    animation = windowsOut, 1, 3, winOut, popin 85%
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, loop
    animation = fade, 1, 4, wind
    animation = workspaces, 1, 5, wind, slide
    animation = specialWorkspaceIn, 1, 3, easeOutQuint, slide top
    animation = specialWorkspaceOut, 1, 2, easeInOutCubic, slide bottom
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_hyprland_guiutils_check = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

xwayland {
    force_zero_scaling = true
}

# ==============================================================================
# Window Rules (Iram Signature Behaviors)
# ==============================================================================
windowrule = suppress_event maximize, match:class .*

# Glassmorphism & Frosted Terminal Opacity
windowrule = opacity 0.92 0.86, match:class ^(Alacritty|iram-.*)$

# Frosted Glass Layer Blur Rules
layerrule = blur 1, match:namespace waybar
layerrule = ignore_alpha 0.1, match:namespace waybar
layerrule = blur 1, match:namespace iram-dock
layerrule = ignore_alpha 0.1, match:namespace iram-dock
layerrule = blur 1, match:namespace wofi
layerrule = ignore_alpha 0.1, match:namespace wofi
layerrule = blur 1, match:namespace swaync-control-center
layerrule = ignore_alpha 0.1, match:namespace swaync-control-center

# Picture-in-Picture
windowrule = float 1, match:title ^(Picture.in.[Pp]icture)$
windowrule = pin 1, match:title ^(Picture.in.[Pp]icture)$
windowrule = size 600 338, match:title ^(Picture.in.[Pp]icture)$
windowrule = opacity 1.0 1.0, match:title ^(Picture.in.[Pp]icture)$

# System Dialogs
windowrule = float 1, match:class ^(pavucontrol|xdg-desktop-portal-.*|org\.kde\.polkit-kde-authentication-agent-1)$
windowrule = center 1, match:class ^(pavucontrol|xdg-desktop-portal-.*|org\.kde\.polkit-kde-authentication-agent-1)$
windowrule = size 875 600, match:class ^(pavucontrol|xdg-desktop-portal-.*|org\.kde\.polkit-kde-authentication-agent-1)$

# File Dialogs
windowrule = float 1, match:title ^(Open.*|Save.*|Choose.*|File Upload.*)$
windowrule = center 1, match:title ^(Open.*|Save.*|Choose.*|File Upload.*)$

# Media & Fullscreen Full Opacity
windowrule = opacity 1.0 1.0, match:class ^(?i)(google-chrome.*|com\.google\.Chrome|chromium.*|firefox.*|brave-browser.*|vlc|mpv|zoom|com\.obsproject\.Studio)$
windowrule = opacity 1.0 1.0, match:title .*(YouTube|Netflix|Twitch|Prime Video|Disney|Plex|Hulu|HBO|Max).*
windowrule = opacity 1.0 1.0, match:fullscreen 1

# Iram Floating Utilities
windowrule = float 1, match:class ^(iram-theme-switcher-gui|iram-appearance|iram-displays-gui|pavucontrol|nm-connection-editor|blueman-manager|blueman-assistant)$
windowrule = float 1, match:class ^(iram-wifi-qr)$
windowrule = size 460 560, match:class ^(iram-wifi-qr)$
windowrule = center 1, match:class ^(iram-wifi-qr)$
windowrule = center 1, match:class ^(iram-theme-switcher-gui|iram-appearance|iram-displays-gui|pavucontrol|nm-connection-editor|blueman-manager|blueman-assistant)$
windowrule = size 1040 720, match:class ^(iram-theme-switcher-gui|iram-appearance)$
windowrule = opacity 1.0 1.0, match:class ^(iram-theme-switcher-gui|iram-appearance)$
windowrule = workspace current, match:class ^(iram-theme-switcher-gui|iram-appearance)$

# Quake-style Drop-down Scratchpad Console (Super + Grave)
windowrule = float 1, match:class ^(iram-scratchpad)$
windowrule = size 85% 55%, match:class ^(iram-scratchpad)$
windowrule = move 7.5% 35, match:class ^(iram-scratchpad)$
windowrule = workspace special:scratchpad, match:class ^(iram-scratchpad)$

# Iram 3D Studio & Mesh Viewer (Three.js)
windowrule = float 1, match:class ^(iram-3d-viewer)$
windowrule = center 1, match:class ^(iram-3d-viewer)$
windowrule = size 1050 720, match:class ^(iram-3d-viewer)$

# Iram Agent 3D Swarm Graph (Three.js)
windowrule = float 1, match:class ^(iram-agent-graph)$
windowrule = center 1, match:class ^(iram-agent-graph)$
windowrule = size 1120 760, match:class ^(iram-agent-graph)$

# Iram 3D Theme Studio (Three.js)
windowrule = float 1, match:class ^(iram-theme-3d)$
windowrule = center 1, match:class ^(iram-theme-3d)$
windowrule = size 1100 740, match:class ^(iram-theme-3d)$

# Iram 3D Motion Graphics & Intro Studio (Three.js)
windowrule = float 1, match:class ^(iram-video-3d)$
windowrule = center 1, match:class ^(iram-video-3d)$
windowrule = size 1150 780, match:class ^(iram-video-3d)$

# Iram Sovereign Command Hub (3D & Multimodal)
windowrule = float 1, match:class ^(iram-hub)$
windowrule = center 1, match:class ^(iram-hub)$
windowrule = size 1200 800, match:class ^(iram-hub)$

# IRAM Nexus (AI Desktop Copilot & GUI)
windowrule = float 1, match:title ^(IRAM OS Nexus.*|IRAM OS Gemini Sidecar.*)$
windowrule = center 1, match:title ^(IRAM OS Nexus.*|IRAM OS Gemini Sidecar.*)$
windowrule = size 960 720, match:title ^(IRAM OS Nexus.*|IRAM OS Gemini Sidecar.*)$
windowrule = opacity 1.0 override 1.0 override, match:title ^(IRAM OS Nexus.*|IRAM OS Gemini Sidecar.*)$
windowrule = float 1, match:class ^(IramNexus|IramGeminiSidecar)$
windowrule = center 1, match:class ^(IramNexus|IramGeminiSidecar)$
windowrule = size 960 720, match:class ^(IramNexus|IramGeminiSidecar)$
windowrule = opacity 1.0 override 1.0 override, match:class ^(IramNexus|IramGeminiSidecar)$
windowrule = float 1, match:title ^(IRAM OS Nexus \(Terminal\)|Iram Agent Sidecar)$
windowrule = center 1, match:title ^(IRAM OS Nexus \(Terminal\)|Iram Agent Sidecar)$
windowrule = size 850 550, match:title ^(IRAM OS Nexus \(Terminal\)|Iram Agent Sidecar)$

# Iram AI Agent
windowrule = float 1, match:title ^(IRAM AI Agent)$
windowrule = center 1, match:title ^(IRAM AI Agent)$
windowrule = size 1000 650, match:title ^(IRAM AI Agent)$

# Floating AI Scratchpad Window Rules
windowrule = float 1, match:class ^(iram-agy-float)$
windowrule = center 1, match:class ^(iram-agy-float)$
windowrule = size 1100 700, match:class ^(iram-agy-float)$
windowrule = opacity 0.98 0.94, match:class ^(iram-agy-float)$

# Floating Creator Studio Window Rules
windowrule = float 1, match:class ^(iram-studio-float)$
windowrule = center 1, match:class ^(iram-studio-float)$
windowrule = size 1150 750, match:class ^(iram-studio-float)$
windowrule = opacity 0.98 0.95, match:class ^(iram-studio-float)$

windowrule = float 1, match:class ^(iram-ai-float)$
windowrule = center 1, match:class ^(iram-ai-float)$
windowrule = size 1050 700, match:class ^(iram-ai-float)$

# Webcam PiP
windowrule = float 1, match:title ^(IRAM Webcam PiP)$
windowrule = pin 1, match:title ^(IRAM Webcam PiP)$
windowrule = size 480 270, match:title ^(IRAM Webcam PiP)$

windowrule = float 1, match:class ^(iram-screensaver)$
windowrule = fullscreen 1, match:class ^(iram-screensaver)$


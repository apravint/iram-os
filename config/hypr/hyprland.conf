# ==============================================================================
# Iram Hyprland Configuration (Quattro Edition)
# ==============================================================================

# Default fallback display rule (portable across laptops, VMs, and custom monitors)
monitor = , preferred, auto, 1

# Optional machine-specific monitor layout & workspace assignments
# Managed dynamically via 'iram display' / 'iram-displays-gui'
source = ~/.config/hypr/monitors.conf

# Smart Gaps & Dynamic Single-Window Focus Mode
workspace = w[tv1], gapsout:0, gapsin:0, border:false
workspace = f[1], gapsout:0, gapsin:0, border:false


# Autostart essential Daemons & Iram System Services
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_DATA_DIRS,$HOME/.local/share:$HOME/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share:/var/lib/snapd/desktop
env = TERMINAL,foot
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Export Wayland & Desktop session to systemd & D-Bus user session
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user start graphical-session.target

exec-once = ~/.local/bin/iram-restart-bar
exec-once = swaybg -i ~/.local/state/iram/current/background -m fill
exec-once = mako
exec-once = ~/.local/bin/iram-launch-polkit
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = ~/.local/bin/iram-theme-sync-all
source = ~/.config/hypr/cursor.conf
exec-once = hyprctl setcursor catppuccin-mocha-lavender-cursors 24
# Audio Output Persistence (Guaranteed HDMI Default & Unmute)
exec-once = ~/.local/bin/iram-audio-init

# First-Boot Interactive Onboarding Guide
exec-once = [ ! -f "$HOME/.local/state/iram/.onboarded" ] && ~/.local/bin/iram-welcome

# Input Devices
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
    sensitivity = 0
}

# Window Layout and Gaps
general {
    gaps_in = 2
    gaps_out = 4
    border_size = 2
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(24283baa)
    layout = dwindle
    allow_tearing = false
}

# Optional Layout Override (Tiling vs Traditional Floating Mode)
source = ~/.config/hypr/layout.conf

# Iram Visual Aesthetics (Sharp Square Edges, Glassmorphic Acrylic & Soft Focus)
decoration {
    rounding = 0
    dim_inactive = true
    dim_strength = 0.10
    active_opacity = 1.0
    inactive_opacity = 0.94

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        vibrancy = 0.20
        noise = 0.02
        popups = true
    }
    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = rgba(00000033)
    }
}

# Ultra-Smooth Fluid Spring Animations
animations {
    enabled = true
    bezier = fluid, 0.16, 1, 0.3, 1
    bezier = winIn, 0.1, 1.05, 0.1, 1.05
    bezier = winOut, 0.3, -0.2, 0, 1
    bezier = liner, 1, 1, 1, 1

    animation = windows, 1, 4, fluid
    animation = windowsIn, 1, 4, winIn, popin 85%
    animation = windowsOut, 1, 3, winOut, popin 85%
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, loop
    animation = fade, 1, 4, fluid
    animation = workspaces, 1, 4, fluid, slide
    animation = specialWorkspace, 1, 4, fluid, slidevert
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_hyprland_guiutils_check = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

xwayland {
    force_zero_scaling = true
}

# ==============================================================================
# Window Rules (Iram Signature Behaviors)
# ==============================================================================
windowrule = suppress_event maximize, match:class .*

# Picture-in-Picture
windowrule = float 1, match:title ^(Picture.in.[Pp]icture)$
windowrule = pin 1, match:title ^(Picture.in.[Pp]icture)$
windowrule = size 600 338, match:title ^(Picture.in.[Pp]icture)$
windowrule = opacity 1.0 1.0, match:title ^(Picture.in.[Pp]icture)$

# System Dialogs
windowrule = float 1, match:class ^(pavucontrol|xdg-desktop-portal-.*|org\.kde\.polkit-kde-authentication-agent-1)$
windowrule = center 1, match:class ^(pavucontrol|xdg-desktop-portal-.*|org\.kde\.polkit-kde-authentication-agent-1)$
windowrule = size 875 600, match:class ^(pavucontrol|xdg-desktop-portal-.*|org\.kde\.polkit-kde-authentication-agent-1)$

# File Dialogs
windowrule = float 1, match:title ^(Open.*|Save.*|Choose.*|File Upload.*)$
windowrule = center 1, match:title ^(Open.*|Save.*|Choose.*|File Upload.*)$

# Media & Fullscreen Full Opacity
windowrule = opacity 1.0 1.0, match:class ^(?i)(google-chrome.*|com\.google\.Chrome|chromium.*|firefox.*|brave-browser.*|vlc|mpv|zoom|com\.obsproject\.Studio)$
windowrule = opacity 1.0 1.0, match:title .*(YouTube|Netflix|Twitch|Prime Video|Disney|Plex|Hulu|HBO|Max).*
windowrule = opacity 1.0 1.0, match:fullscreen 1

# Iram Floating Utilities
windowrule = float 1, match:class ^(iram-theme-switcher-gui|iram-displays-gui|pavucontrol|nm-connection-editor|blueman-manager|blueman-assistant)$
windowrule = center 1, match:class ^(iram-theme-switcher-gui|iram-displays-gui|pavucontrol|nm-connection-editor|blueman-manager|blueman-assistant)$
windowrule = size 980 700, match:class ^(iram-theme-switcher-gui)$
windowrule = opacity 1.0 1.0, match:class ^(iram-theme-switcher-gui)$

# Iram 3D Studio & Mesh Viewer (Three.js)
windowrule = float 1, match:class ^(iram-3d-viewer)$
windowrule = center 1, match:class ^(iram-3d-viewer)$
windowrule = size 1050 720, match:class ^(iram-3d-viewer)$

# Iram Agent 3D Swarm Graph (Three.js)
windowrule = float 1, match:class ^(iram-agent-graph)$
windowrule = center 1, match:class ^(iram-agent-graph)$
windowrule = size 1120 760, match:class ^(iram-agent-graph)$

# Iram 3D Theme Studio (Three.js)
windowrule = float 1, match:class ^(iram-theme-3d)$
windowrule = center 1, match:class ^(iram-theme-3d)$
windowrule = size 1100 740, match:class ^(iram-theme-3d)$

# Iram 3D Motion Graphics & Intro Studio (Three.js)
windowrule = float 1, match:class ^(iram-video-3d)$
windowrule = center 1, match:class ^(iram-video-3d)$
windowrule = size 1150 780, match:class ^(iram-video-3d)$

# Iram Sovereign Command Hub (3D & Multimodal)
windowrule = float 1, match:class ^(iram-hub)$
windowrule = center 1, match:class ^(iram-hub)$
windowrule = size 1200 800, match:class ^(iram-hub)$

# Iram Agent Sidecar
windowrule = float 1, match:title ^(Iram Agent Sidecar)$
windowrule = center 1, match:title ^(Iram Agent Sidecar)$
windowrule = size 850 550, match:title ^(Iram Agent Sidecar)$

# Iram AI Agent
windowrule = float 1, match:title ^(IRAM AI Agent)$
windowrule = center 1, match:title ^(IRAM AI Agent)$
windowrule = size 1000 650, match:title ^(IRAM AI Agent)$

# Floating AI Scratchpad Window Rules
windowrule = float 1, match:class ^(iram-ai-float)$
windowrule = center 1, match:class ^(iram-ai-float)$
windowrule = size 1050 700, match:class ^(iram-ai-float)$

# Webcam PiP
windowrule = float 1, match:title ^(IRAM Webcam PiP)$
windowrule = pin 1, match:title ^(IRAM Webcam PiP)$
windowrule = size 480 270, match:title ^(IRAM Webcam PiP)$


binde = $mainMod ALT SHIFT, minus, resizeactive, 0 -15
binde = $mainMod ALT SHIFT, equal, resizeactive, 0 15

# Modal Keybinding Submaps
# 1. Interactive Modal Window Resize Mode (Super + R)
bind = $mainMod, R, submap, resize
submap = resize
binde = , right, resizeactive, 20 0
binde = , left, resizeactive, -20 0
binde = , up, resizeactive, 0 -20
binde = , down, resizeactive, 0 20
binde = , l, resizeactive, 20 0
binde = , h, resizeactive, -20 0
binde = , k, resizeactive, 0 -20
binde = , j, resizeactive, 0 20
bind = , escape, submap, reset
bind = , Return, submap, reset
submap = reset

# 2. VM / Remote Desktop Passthrough Mode (Super + Alt + P)
bind = $mainMod ALT, P, submap, passthrough
submap = passthrough
bind = $mainMod, Escape, submap, reset
submap = reset

# Quake-style Drop-down Scratchpad Console (Super + Grave)
bind = $mainMod, grave, exec, ~/.local/bin/iram-scratchpad
bind = $mainMod, S, togglespecialworkspace, scratchpad
bind = $mainMod SHIFT, grave, movetoworkspace, special:scratchpad
bind = $mainMod ALT SHIFT, S, movetoworkspace, special:scratchpad

# Fine (±25px) & Coarse (±100px) Window Resizing (Omarchy 4.5 standard)
binde = $mainMod ALT, bracketleft, resizeactive, -25 0
binde = $mainMod ALT, bracketright, resizeactive, 25 0
binde = $mainMod CTRL, left, resizeactive, -100 0
binde = $mainMod CTRL, right, resizeactive, 100 0
binde = $mainMod CTRL, up, resizeactive, 0 -100
binde = $mainMod CTRL, down, resizeactive, 0 100

# Window Movement across Tiles and Monitors
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Monitor Navigation & Focus (Omarchy 4.5 standard)
bind = $mainMod, bracketleft, focusmonitor, -1
bind = $mainMod, bracketright, focusmonitor, +1
bind = $mainMod SHIFT, bracketleft, movecurrentworkspacetomonitor, -1
bind = $mainMod SHIFT, bracketright, movecurrentworkspacetomonitor, +1

# Audio & Media Controls
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = SHIFT, XF86AudioMute, exec, ~/.local/bin/iram-toggle-tv-samsung
bind = $mainMod SHIFT, T, exec, ~/.local/bin/iram-toggle-tv-samsung
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Display Brightness Controls (Internal Panels & External DDC/CI Monitors)
binde = , XF86MonBrightnessUp, exec, ~/.local/bin/iram-brightness +5%
binde = , XF86MonBrightnessDown, exec, ~/.local/bin/iram-brightness 5%-
bind = SHIFT, XF86MonBrightnessUp, exec, ~/.local/bin/iram-brightness 100%
bind = SHIFT, XF86MonBrightnessDown, exec, ~/.local/bin/iram-brightness 20%
binde = $mainMod, F6, exec, ~/.local/bin/iram-brightness +5%
binde = $mainMod, F5, exec, ~/.local/bin/iram-brightness 5%-

# Focus Movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspace Switching & Cycling
bind = $mainMod, Tab, workspace, m+1
bind = $mainMod SHIFT, Tab, workspace, m-1
# Intelligent Per-Monitor Workspace Switching (Super + 1..0)
bind = $mainMod, 1, exec, ~/.local/bin/iram-workspace-switch 1 switch
bind = $mainMod, 2, exec, ~/.local/bin/iram-workspace-switch 2 switch
bind = $mainMod, 3, exec, ~/.local/bin/iram-workspace-switch 3 switch
bind = $mainMod, 4, exec, ~/.local/bin/iram-workspace-switch 4 switch
bind = $mainMod, 5, exec, ~/.local/bin/iram-workspace-switch 5 switch
bind = $mainMod, 6, exec, ~/.local/bin/iram-workspace-switch 6 switch
bind = $mainMod, 7, exec, ~/.local/bin/iram-workspace-switch 7 switch
bind = $mainMod, 8, exec, ~/.local/bin/iram-workspace-switch 8 switch
bind = $mainMod, 9, exec, ~/.local/bin/iram-workspace-switch 9 switch
bind = $mainMod, 0, exec, ~/.local/bin/iram-workspace-switch 10 switch

# Move active window to per-monitor workspace 1-10
bind = $mainMod SHIFT, 1, exec, ~/.local/bin/iram-workspace-switch 1 move
bind = $mainMod SHIFT, 2, exec, ~/.local/bin/iram-workspace-switch 2 move
bind = $mainMod SHIFT, 3, exec, ~/.local/bin/iram-workspace-switch 3 move
bind = $mainMod SHIFT, 4, exec, ~/.local/bin/iram-workspace-switch 4 move
bind = $mainMod SHIFT, 5, exec, ~/.local/bin/iram-workspace-switch 5 move
bind = $mainMod SHIFT, 6, exec, ~/.local/bin/iram-workspace-switch 6 move
bind = $mainMod SHIFT, 7, exec, ~/.local/bin/iram-workspace-switch 7 move
bind = $mainMod SHIFT, 8, exec, ~/.local/bin/iram-workspace-switch 8 move
bind = $mainMod SHIFT, 9, exec, ~/.local/bin/iram-workspace-switch 9 move
bind = $mainMod SHIFT, 0, exec, ~/.local/bin/iram-workspace-switch 10 move

# Mouse Window Control (Move/Resize)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop Clamshell & External Monitor Automation (Omarchy 4.5 standard)
bindl = , switch:on:Lid Switch, exec, ~/.local/bin/iram-hw-clamshell close
bindl = , switch:off:Lid Switch, exec, ~/.local/bin/iram-hw-clamshell open

# ==============================================================================
# Window Titlebars for Floating Workspaces (Hyprbars Plugin Integration)
# ==============================================================================
plugin {
    hyprbars {
        bar_height = 30
        bar_color = rgba(1e2030ee)
        col.text = rgba(cad3f5ff)
        bar_text_font = JetBrains Mono
        bar_text_size = 11
        bar_text_align = left
        bar_buttons_alignment = right
        bar_part_of_window = true
        bar_precedence_over_border = true
        bar_padding = 10
        bar_button_padding = 8
        button_rounding = 0
        icon_on_hover = false

        # Window Controls (Close, Maximize, Minimize to Dock)
        hyprbars-button = rgb(ed8796), 14, ×, hyprctl dispatch killactive
        hyprbars-button = rgb(eed49f), 14, □, hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(a6da95), 14, −, ~/.local/bin/iram-hyprland-window-minimize
    }
}

# ==============================================================================
# User Custom Overrides (Guaranteed absolute last precedence)
# ==============================================================================
source = ~/.config/hypr/user-overrides.conf






# ==============================================================================
# IRAM OS Hypridle Configuration
# Manages DPMS display sleep and automatic lock screen
# ==============================================================================

general {
    lock_cmd = pidof hyprlock || ~/.local/bin/iram-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 1. Dim & turn off display after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 2. Lock screen after 10 minutes of inactivity
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

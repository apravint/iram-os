# ==============================================================================
# IRAM OS Hypridle Configuration
# Manages progressive screen dimming, automated locking, and DPMS sleep
# 1. Dim display at 5m (300s)
# 2. Lock session at 10m (600s)
# 3. DPMS display sleep at 15m (900s)
# https://github.com/apravint/iram-os
# ==============================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 1. Dim display brightness after 5 minutes (300s)
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10% 2>/dev/null || iram brightness 10% 2>/dev/null || true
    on-resume = brightnessctl -r 2>/dev/null || iram brightness 100% 2>/dev/null || true
}

# 2. Lock screen after 10 minutes (600s)
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 3. Turn off displays (DPMS sleep) after 15 minutes (900s)
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

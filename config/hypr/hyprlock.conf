# ==============================================================================
# IRAM OS Dynamic Themed Hyprlock Configuration
# Uses current background wallpaper and dynamic theme palette
# ==============================================================================

background {
    monitor =
    path = ~/.local/state/iram/current/background
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    fade_on_empty = false
    font_color = rgb(205, 214, 244)
    inner_color = rgba(17, 17, 27, 0.75)
    outer_color = rgba(137, 180, 250, 0.8)
    check_color = rgba(166, 227, 161, 0.8)
    fail_color = rgba(243, 139, 168, 0.8)
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(205, 214, 244, 0.95)
    font_size = 80
    font_family = JetBrains Mono Bold
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(147, 153, 178, 0.85)
    font_size = 18
    font_family = JetBrains Mono
    position = 0, 30
    halign = center
    valign = center
}

label {
    monitor =
    text = ⚡ IRAM OS • Sovereign Agentic Desktop
    color = rgba(137, 180, 250, 0.6)
    font_size = 12
    font_family = JetBrains Mono
    position = 0, 30
    halign = center
    valign = bottom
}

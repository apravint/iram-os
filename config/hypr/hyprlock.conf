# ==============================================================================
# IRAM OS Dynamic Themed Hyprlock Configuration
# Sourced dynamically via ~/.config/hypr/hyprlock-colors.conf and theme background
# https://github.com/apravint/iram-os
# ==============================================================================

# Dynamic color definitions generated by iram-theme-sync-all
source = ~/.config/hypr/hyprlock-colors.conf

# Fallback color defaults if hyprlock-colors.conf is not yet populated
$accent ?= rgb(7aa2f7)
$font_color ?= rgb(c0caf5)
$inner_color ?= rgba(1a1b26cc)
$outer_color ?= rgba(7aa2f7cc)
$check_color ?= rgba(9ece6aee)
$fail_color ?= rgba(f7768eee)

background {
    monitor =
    path = ~/.local/state/iram/current/background
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    fade_on_empty = false
    font_color = $font_color
    inner_color = $inner_color
    outer_color = $outer_color
    check_color = $check_color
    fail_color = $fail_color
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $font_color
    font_size = 80
    font_family = JetBrains Mono Bold
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = $font_color
    font_size = 18
    font_family = JetBrains Mono
    position = 0, 30
    halign = center
    valign = center
}

label {
    monitor =
    text = ⚡ IRAM OS • Sovereign Agentic Desktop
    color = $accent
    font_size = 12
    font_family = JetBrains Mono
    position = 0, 30
    halign = center
    valign = bottom
}

context.modules = [
    {
        name = libpipewire-module-combine-stream
        args = {
            combine.mode = sink
            node.name = "combined_displays"
            node.description = "All Displays (Samsung + Sony TV)"
            combine.latency-compensate = false
            combine.props = {
                audio.position = [ FL FR ]
            }
            stream.rules = [
                {
                    matches = [
                        { "node.name" = "alsa_output.pci-0000_01_00.1.playback.3.0" }
                    ]
                    actions = {
                        create-stream = {
                            audio.position = [ AUX0 AUX1 ]
                            target.object = "alsa_output.pci-0000_01_00.1.playback.3.0"
                        }
                    }
                },
                {
                    matches = [
                        { "node.name" = "alsa_output.pci-0000_01_00.1.playback.7.0" }
                    ]
                    actions = {
                        create-stream = {
                            audio.position = [ AUX0 AUX1 ]
                            target.object = "alsa_output.pci-0000_01_00.1.playback.7.0"
                        }
                    }
                }
            ]
        }
    }
]
